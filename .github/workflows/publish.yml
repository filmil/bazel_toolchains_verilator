# Publish to my Bazel registry, the same way the other rulesets here do.
name: "Publish to my Bazel registry"

# A module tag publishes the module. The binary tags, `verilator-*`,
# do not come here: they carry an artifact rather than a module
# version.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.0.0"
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      # Not the central registry: this module hands out a binary built
      # from someone else's source, which is a thing to keep close to
      # home rather than to offer the world.
      registry: filmil/bazel-registry
      registry_fork: filmil/bazel-registry
      attest: false
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
